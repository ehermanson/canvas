name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Use the same CLI as local verification; a global npm install can run
      # its own incompatible test runner instead of the project's locked one.
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          version: "0.1.19"
          node-version: "22"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        run: vp run -r build
